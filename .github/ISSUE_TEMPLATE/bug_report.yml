name: Bug Report
description: Report a problem with Yoga Book Reader
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the information below so we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the app are you using?
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Which device are you on?
      placeholder: "Lenovo Yoga Book Gen 10 / Surface Pro / custom dual-monitor setup / etc."
    validations:
      required: true
  - type: textarea
    id: display_config
    attributes:
      label: Display Configuration
      description: How are your screens set up?
      placeholder: "Both screens, portrait, side-by-side / Single screen, landscape / etc."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What did you do to trigger the bug?
      placeholder: |
        1. Launch the app
        2. Open file...
        3. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: file_info
    attributes:
      label: File Information (if applicable)
      description: What file were you trying to read? Format, size, page count?
      placeholder: "PDF, ~50MB, 200 pages"
  - type: textarea
    id: logs
    attributes:
      label: Log Output (if available)
      description: Any error messages or console output?
      render: shell
