name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem This Solves
      description: What problem are you trying to solve? Is there something the app can't do that you need?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other ways this could be solved? Workarounds you've tried?
  - type: checkboxes
    id: device_check
    attributes:
      label: Device Context
      description: This app is designed for dual-screen Windows devices
      options:
        - label: This feature is relevant to the dual-screen reading experience
