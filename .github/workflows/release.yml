name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in v1.1.7

            Performance-focused release targeting the 20–25s silent launch delay reported on large libraries:

            ### Performance
            - **Launch no longer blocks on temp cleanup** — a large leftover comic-extraction temp directory (which only accumulates after a crash or force-quit) could previously delay the very first window paint by many seconds with zero visual feedback. Cleanup now runs without blocking window creation.
            - **Splash screen shows a loading spinner** during initial data load instead of appearing frozen.
            - **Library rendering no longer floods the app with cache-check calls** — large libraries now check which covers are already cached in one batched call instead of one call per item.
            - **State reads no longer re-read the whole settings file from disk** on every call; the app keeps an in-memory copy in sync instead.
          draft: false
          # Tags containing "beta" (e.g. v1.1.4-beta) publish as pre-releases.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          files: dist/*.exe
