name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in v1.1.9

            Portable launch feedback.

            ### Launch
            - **Portable build shows a "Loading…" splash while it extracts.** The portable `.exe` unpacks itself (and Defender scans it) before the app can start — previously a blank, frozen-looking gap of up to ~20s on slow disks. It now shows a branded splash during that unpack so it's clearly launching.
            - **README explains the portable-vs-installer launch-speed difference** — the installer runs in place and launches fast; the portable build trades a slower first launch for being a single no-install file. Use the installer if launch time bothers you.
          draft: false
          # Tags containing "beta" (e.g. v1.1.4-beta) publish as pre-releases.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          files: dist/*.exe
