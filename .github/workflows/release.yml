name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in v1.1.8

            Performance release: launch delay, massive PDF memory reduction, and progress bars.

            ### Launch
            - **Window appears before disk I/O** — splash visible in 1–3s (was 20+s with large libraries).
            - **pdf.js lazy-loaded** on splash — 650KB module no longer blocks first paint.
            - **Spinner stays until content is ready** — no blank library during fresh scans.

            ### Memory
            - **HTTP Range requests** in the protocol handler — pdf.js streams only what it needs.
            - **Streaming enabled** in renderers — ~75% memory reduction per renderer for large PDFs.
            - **Main-process PDF parsing uses `file://` URL** — eliminates 200+MB buffer allocation.

            ### Progress
            - **Determinate progress bar** for library scan, comic extraction, and PDF classification.
            - Progress callbacks in every long-running main-process operation.
          draft: false
          # Tags containing "beta" (e.g. v1.1.4-beta) publish as pre-releases.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          files: dist/*.exe
