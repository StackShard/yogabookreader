name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in v1.1.3

            ### Spread Alignment
            - **Spread nudge** — fix a skipped or mis-scanned page that throws off every two-page pair from that point on. **⇥ Nudge** forces the current page to start a spread alone, re-aligning everything after it without moving your place; **Reset align** clears it. Saved per document, and supports several nudges for books with multiple bad pages.

            ### Reading Progress
            - Recent and Library tiles show **page-of-total** progress (e.g. `42 / 180`), falling back to `Page 42`, then the document type.

            ### Library Tools
            - **Open containing folder** — long-press or right-click any tile to reveal the file in Explorer.
            - **Clean missing** — drop recent entries whose files were moved or deleted.
            - **Regenerate covers** — clear the thumbnail cache and rebuild covers.

            ### Reader & Help
            - **Better error recovery** — file-open errors offer *Choose another file*, *Remove from Recent*, and a *Show details* toggle.
            - **Single-screen diagnostic** — the splash screen explains when a two-page spread isn't possible.
            - **Version line** on the help screen, and the page-picker button is now **Jump Page**.

            ### Fixes
            - **Application icon** now shows correctly in the Windows *small icons* view.
          draft: false
          prerelease: false
          files: dist/*.exe
