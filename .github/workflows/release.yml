name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in v1.1.5-beta

            > Beta / pre-release.

            ### Fixes
            - **Print scaling** — a printed page now fills the sheet (aspect preserved, small margin) instead of printing as a small graphic in the middle, and wide pages print in landscape. Print preview is still unavailable (an Electron limitation of the system print path).

            ### Recent (from v1.1.4-beta)
            - **Save or print a page** — hold the centre "Tap for menu" area of either screen for a **Save page** / **Print page** menu. Save uses a collision-free name (`<Title> - p<N>.<ext>` in Pictures); comics save the original image, PDF pages save as a high-res PNG.
            - **Jump Page dial pad** sits lower on screen and its number display no longer jumps when you type the first digit.
            - **Splash**: the Quit button is now the leftmost action, matching the reader bar.
          draft: false
          # Tags containing "beta" (e.g. v1.1.4-beta) publish as pre-releases.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          files: dist/*.exe
