name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in this Release

            ### New Gestures & Shortcuts
            - **Double-tap centre** of the screen to cycle zoom presets (Fit Width → Fit Height → Full Bleed)
            - **Long-press left edge** to jump to the **first page**
            - **Long-press right edge** to jump to the **last page**
            - **Home / End keys** — jump to first / last page

            ### UI Improvements
            - **Active zoom highlight** — the current zoom-preset button is highlighted in the settings strip
            - **Book title** shown above the progress bar when a document is open
            - **Settings strip auto-collapses** after selecting zoom or direction — one less tap to get back to reading
            - **Swipe down** on the settings strip dismisses the overlay entirely
            - **Control bar reordered** — Quit · Help · Settings · Library · brightness · Auto, brightness and Auto always visible
          draft: false
          prerelease: false
          files: dist/*.exe
