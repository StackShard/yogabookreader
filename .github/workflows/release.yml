name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Yoga Book Reader ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Changes in v1.1.6

            First stable release since v1.1.3 — supersedes the v1.1.4-beta and v1.1.5-beta pre-releases (page save/print, print scaling) with no functional changes to that work, plus a full quality-of-life pass:

            ### Reading
            - **RTL (manga) mode now swaps the directional controls** — edge taps, held edges, swipes and arrow keys follow the right-to-left reading direction, so the left edge turns to the next page.
            - **Double-tap zoom cycling works on the left screen too.**
            - **Comics with duplicate page names across sub-folders** no longer lose pages.
            - A page that repeatedly fails to load now shows a clear notice instead of retrying forever.
            - Gestures interrupted by Windows no longer trigger a stray jump to the first/last page.

            ### App & Library
            - **Launching the app while it's already running now focuses the running window** (and opens the file passed on the command line) instead of closing silently. The installer registers the app as an "Open with" handler for PDF/CBZ/CBR.
            - **Opening feedback** — the library shows "Opening…" immediately while a large comic extracts.
            - Cover regeneration and generation no longer get stuck or duplicate work.

            ### Controls & Polish
            - **Escape closes the topmost layer first**, then toggles full-screen. **F / F11** toggle full-screen as documented; **Shift+Space** pages backwards.
            - **Tapping the centre now toggles the control bar.**
            - The Jump Page dial pad shows the page range and visibly clamps input beyond the last page.
            - Failed page saves report the failure; file-open errors gained a **Back to library** button.

            ### Performance
            - Page turns write reading progress to disk once instead of twice.
            - Dragging the brightness slider no longer spawns a process per tick.
          draft: false
          # Tags containing "beta" (e.g. v1.1.4-beta) publish as pre-releases.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          files: dist/*.exe
