<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' yreader: blob: data: ws:; img-src 'self' yreader: blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:;"
    />
    <title>Yoga Book Reader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- One screen of the two-page spread. The stage captures touch zones; the
         canvas paints the page; the overlay (right window only) is injected by JS. -->
    <div id="stage" class="stage">
      <canvas id="page" class="page"></canvas>
    </div>
    <!-- Loading spinner shown until the first page paints. -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>
    <script type="module" src="./reader.ts"></script>
  </body>
</html>
