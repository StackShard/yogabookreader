<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <!--
      CSP: yreader: = custom protocol for local files.
      unsafe-eval = needed for pdf.js (uses new Function internally).
      unsafe-inline = needed for Vite dev-server style injection.
      ws: = Vite HMR in development; harmless in production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' yreader: blob: data: ws:; img-src 'self' yreader: blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:;"
    />
    <title>Yoga Book Reader — Library</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="splash">
    <div id="primary-view">
      <header class="splash-header">
        <h1>Yoga Book Reader</h1>
      </header>
      <main class="splash-scroll">
        <section>
          <h2>Recent <button id="clear-recent" class="ghost-btn" style="font-size:14px;min-height:auto;padding:6px 14px;margin-left:12px;vertical-align:middle">Clear</button></h2>
          <div id="recent" class="gallery"></div>
        </section>
        <div class="section-divider"></div>
        <section>
          <h2>Library</h2>
          <p id="library-folder" class="library-folder"></p>
          <div id="library"></div>
        </section>
      </main>
      <!-- Thumb-reachable action bar (mirrors the reading control bar position). -->
      <div class="splash-actionbar">
        <button id="resume" class="primary-btn" hidden>Resume reading</button>
        <button id="open-file" class="primary-btn">Open file…</button>
        <button id="choose-folder" class="ghost-btn">Choose folder</button>
        <button id="exit" class="ghost-btn">Exit</button>
      </div>
    </div>
    <div id="secondary-view" class="secondary-view" hidden>
      <p>Library is open on the other screen.</p>
    </div>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
