<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8e4f5"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8e4f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded-square app background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="214" fill="none" stroke="#4c9aff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Open book: two portrait pages forming a spread (the product identity) -->
  <g filter="url(#shadow)">
    <!-- Accent boards behind the pages -->
    <path d="M168 300
             C 300 256, 452 256, 512 312
             L 512 800
             C 452 748, 300 748, 168 792 Z" fill="#2f7be0"/>
    <path d="M856 300
             C 724 256, 572 256, 512 312
             L 512 800
             C 572 748, 724 748, 856 792 Z" fill="#4c9aff"/>

    <!-- Left page -->
    <path d="M196 320
             C 312 288, 436 288, 500 332
             L 500 772
             C 436 732, 312 732, 196 764 Z" fill="url(#pageL)"/>
    <!-- Right page -->
    <path d="M828 320
             C 712 288, 588 288, 524 332
             L 524 772
             C 588 732, 712 732, 828 764 Z" fill="url(#pageR)"/>

    <!-- Centre gutter / spine (the dual-screen seam) -->
    <rect x="504" y="312" width="16" height="468" rx="8" fill="#1b2a44"/>

    <!-- Text lines on the pages -->
    <g fill="#9bb6dd">
      <rect x="250" y="396" width="190" height="22" rx="11"/>
      <rect x="250" y="452" width="210" height="22" rx="11"/>
      <rect x="250" y="508" width="170" height="22" rx="11"/>
      <rect x="250" y="564" width="205" height="22" rx="11"/>
      <rect x="250" y="620" width="150" height="22" rx="11"/>

      <rect x="584" y="396" width="190" height="22" rx="11"/>
      <rect x="564" y="452" width="210" height="22" rx="11"/>
      <rect x="604" y="508" width="170" height="22" rx="11"/>
      <rect x="569" y="564" width="205" height="22" rx="11"/>
      <rect x="624" y="620" width="150" height="22" rx="11"/>
    </g>
  </g>
</svg>
